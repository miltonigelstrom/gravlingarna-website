name: Uppdatera Google-omdömen

on:
  schedule:
    - cron: '0 7 * * 1'  # Varje måndag kl 09:00 svensk tid
  workflow_dispatch:       # Kan även köras manuellt på GitHub

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Skapa reviews-config.json från secret
        run: |
          echo '{"api_key":"${{ secrets.GOOGLE_PLACES_API_KEY }}","place_id":"ChIJD1ZenzRQS4gRD8kiLyPkUYc"}' > reviews-config.json

      - name: Kör reviews-uppdatering
        run: python update_reviews.py

      - name: Pusha om något ändrades
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html reviews-update.log
          git diff --staged --quiet || git commit -m "Automatisk uppdatering av Google-omdömen"
          git push
